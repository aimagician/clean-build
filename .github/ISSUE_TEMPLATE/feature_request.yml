name: Feature request
description: Suggest an improvement or a new capability.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security impact
      description: Would this open a network path, add a mount or shared directory during build/watch, or change what gets logged? clean-builder is only useful while its offline guarantee holds — say how the idea keeps it.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
